openapi: 3.0.3
info:
  title: SurveyTools KYC & Researcher Profile API
  version: 1.0.0
  description: >
    KYC and Researcher Profile endpoints for SurveyTools.
    Includes unified registration, progressive profiling (Layers 1-5), and OTP verification.

servers:
  - url: "{{base_url}}"
    description: Configured base URL (set per environment in Postman)

paths:
  /v1/kyc/register:
    post:
      tags:
        - 1. Authentication
      summary: Unified registration for researchers and respondents
      description: >
        Creates a new User account, branching downstream profiles via the
        userType field. Age is strictly validated to be 18+.
      operationId: registerKycUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupBody'
            example:
              firstName: John
              lastName: Doe
              email: john.doe@example.com
              password: SecurePass123!
              userType: respondent
              dateOfBirth: '1995-06-15T00:00:00.000Z'
              gender: male
              stateOfResidence: Lagos
              lgaOfResidence: Ikeja
              isStudent: false
              referralCode: REFCODE123
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              example:
                status: success
                data:
                  userId: usr_98a7b6c5d4e3f2a1
                  referralApplied: true

  /v1/kyc/otp/request:
    post:
      tags:
        - 7. OTP Verification
      summary: Issue a 6-digit OTP to a phone number
      description: >
        Generates a 6-digit OTP and sends it via SMS to the provided phone number.
        Any previously active OTP for that number is invalidated before a new one
        is issued. Public endpoint — no authentication required.
      operationId: requestPhoneOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestOtpBody'
      responses:
        '200':
          description: OTP sent successfully
        '400':
          description: Validation error

  /v1/kyc/otp/verify:
    post:
      tags:
        - 7. OTP Verification
      summary: Verify a phone OTP
      description: >
        Checks the submitted 6-digit code against the most recent active OTP
        for the given phone number. Marks the OTP consumed on success so it
        cannot be replayed. Public endpoint — no authentication required.
      operationId: verifyPhoneOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpBody'
      responses:
        '200':
          description: Phone number verified successfully
        '400':
          description: Invalid OTP

  /v1/kyc/email-otp/request:
    post:
      tags:
        - 7. OTP Verification
      summary: Issue a 6-digit OTP to any email
      description: Generates a 6-digit OTP and sends it via email to any valid email address for general email verification.
      operationId: requestEmailOtp
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestEmailOtpBody'
      responses:
        '200':
          description: OTP sent successfully
        '400':
          description: Validation error

  /v1/kyc/email-otp/verify:
    post:
      tags:
        - 7. OTP Verification
      summary: Verify a general email OTP
      description: Checks the submitted 6-digit code and marks emailVerified as true.
      operationId: verifyEmailOtp
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailOtpBody'
      responses:
        '200':
          description: Email verified successfully
        '400':
          description: Invalid OTP

  /v1/kyc/academic-email-otp/request:
    post:
      tags:
        - 7. OTP Verification
      summary: Issue a 6-digit OTP to an academic institutional email
      description: Generates a 6-digit OTP and sends it via email to a .edu.ng address for student researcher verification.
      operationId: requestAcademicEmailOtp
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestAcademicEmailOtpBody'
      responses:
        '200':
          description: OTP sent successfully
        '400':
          description: Validation error

  /v1/kyc/academic-email-otp/verify:
    post:
      tags:
        - 7. OTP Verification
      summary: Verify an academic email OTP
      description: Checks the submitted 6-digit code and marks academicEmailVerified as true for student researchers.
      operationId: verifyAcademicEmailOtp
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyAcademicEmailOtpBody'
      responses:
        '200':
          description: Academic email verified successfully
        '400':
          description: Invalid OTP

  /v1/kyc/researcher/profile:
    post:
      tags:
        - 8. Profiles & Progressive Layers
      summary: Submit researcher profile
      description: Submits a student, professional, or corporate researcher profile.
      operationId: submitResearcherProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResearcherProfileBody'
      responses:
        '201':
          description: Profile created successfully

  /v1/kyc/account-type:
    patch:
      tags:
        - 8. Profiles & Progressive Layers
      summary: Update account type for existing users
      description: Allows existing users to set their account type (researcher or respondent) and submit their complete profile in a single call. Automatically assigns tiers for researchers (student -> Standard, professional -> Premium, corporate -> Institutional).
      operationId: updateAccountType
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountTypeBody'
      responses:
        '200':
          description: Account type updated successfully
        '400':
          description: Validation error
        '404':
          description: User not found

  /v1/kyc/researcher/tier:
    get:
      tags:
        - 8. Profiles & Progressive Layers
      summary: Get researcher pricing tier
      description: Returns the user's current pricing tier based on their researcher profile.
      operationId: getResearcherTier
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Tier retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  data:
                    type: object
                    properties:
                      tier: { type: string }

  /v1/kyc/respondent/layer1:
    post:
      tags:
        - 8. Profiles & Progressive Layers
      summary: Submit respondent layer 1 profile
      description: Basic demographics and academic info.
      operationId: submitRespondentLayer1
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Layer1Body'
      responses:
        '200':
          description: Layer 1 profile completed successfully

  /v1/kyc/respondent/layer2:
    post:
      tags:
        - 8. Profiles & Progressive Layers
      summary: Submit respondent layer 2 profile
      description: Submits the progressive Layer 2 profile.
      operationId: submitRespondentLayer2
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Layer2Body'
      responses:
        '200':
          description: Layer 2 profile completed successfully

  /v1/kyc/respondent/layer-status:
    get:
      tags:
        - 8. Profiles & Progressive Layers
      summary: Get layer completion status
      description: Returns the completion state and trigger status for KYC layers.
      operationId: getLayerStatus
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Status retrieved successfully

  /v1/kyc/respondent/survey-completed:
    post:
      tags:
        - 8. Profiles & Progressive Layers
      summary: Simulate survey completed (trigger layer unlock)
      description: Internal hook called after a survey is submitted. Increments the respondent's survey count and unlocks Layer 2 if the configured threshold is met.
      operationId: hookSurveyCompleted
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Survey completion recorded successfully

  /v1/kyc/respondent/layer3:
    post:
      tags:
        - 8. Profiles & Progressive Layers
      summary: Submit respondent sensitive layer 3
      description: Health and lifestyle data (chronic conditions, smoking, exercise, blood group, genotype). Fields are encrypted at rest using AES-256-GCM.
      operationId: submitRespondentLayer3
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Layer3Body'
      responses:
        '200':
          description: Layer 3 profile submitted successfully

  /v1/kyc/respondent/layer4:
    post:
      tags:
        - 8. Profiles & Progressive Layers
      summary: Submit respondent sensitive layer 4
      description: Socioeconomic profile data (income, housing, transport, devices, dependants). Fields are encrypted at rest using AES-256-GCM.
      operationId: submitRespondentLayer4
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Layer4Body'
      responses:
        '200':
          description: Layer 4 profile submitted successfully

  /v1/kyc/respondent/layer5:
    post:
      tags:
        - 8. Profiles & Progressive Layers
      summary: Submit respondent sensitive layer 5
      description: Cultural and identity data (religion, ethnicity, languages spoken, marital status). Fields are encrypted at rest using AES-256-GCM.
      operationId: submitRespondentLayer5
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Layer5Body'
      responses:
        '200':
          description: Layer 5 profile submitted successfully

  /v1/kyc/consent:
    post:
      tags:
        - 9. NDPR & Compliance
      summary: Capture initial NDPR consent
      description: Records the respondent's initial consent to data collection and processing under NDPR.
      operationId: captureConsent
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentBody'
      responses:
        '201':
          description: Consent recorded successfully

  /v1/kyc/consent/{scope}:
    patch:
      tags:
        - 9. NDPR & Compliance
      summary: Update consent for a specific scope
      description: Allows a respondent to update their consent status for a specific processing scope (e.g. marketing, research).
      operationId: updateConsent
      security:
        - BearerAuth: []
      parameters:
        - name: scope
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentUpdateBody'
      responses:
        '200':
          description: Consent updated successfully

  /v1/kyc/me:
    delete:
      tags:
        - 9. NDPR & Compliance
      summary: Erase respondent KYC data (NDPR right to erasure)
      description: Permanently erases all KYC profile data for the authenticated respondent, in compliance with NDPR right-to-erasure obligations.
      operationId: eraseKycData
      security:
        - BearerAuth: []
      responses:
        '200':
          description: KYC data erased successfully

  /forget-password:
    post:
      tags:
        - 1. Authentication
      summary: Request password reset OTP
      description: Sends a 6-digit OTP to the user's email for password reset.
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: If an account exists for this email, a reset code has been sent

  /reset-password:
    post:
      tags:
        - 1. Authentication
      summary: Reset password using OTP
      description: Verifies the 6-digit OTP and sets a new password.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordBody'
      responses:
        '200':
          description: Password has been reset successfully
        '400':
          description: Validation error or invalid OTP

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by the existing SurveyTools auth flow

  schemas:
    SignupBody:
      description: The payload varies based on userType.
      oneOf:
        - $ref: '#/components/schemas/SignupResearcherBody'
        - $ref: '#/components/schemas/SignupRespondentNonStudentBody'
        - $ref: '#/components/schemas/SignupRespondentStudentBody'

    SignupCommonBody:
      type: object
      required: [firstName, lastName, email, password, userType, dateOfBirth]
      properties:
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        userType: { type: string, enum: [researcher, respondent] }
        dateOfBirth: { type: string, format: date-time }
        referralCode: { type: string, minLength: 10, maxLength: 10, description: Optional 10-character referral code }

    SignupResearcherBody:
      allOf:
        - $ref: '#/components/schemas/SignupCommonBody'
        - type: object
          properties:
            userType: { type: string, enum: [researcher] }

    SignupRespondentNonStudentBody:
      allOf:
        - $ref: '#/components/schemas/SignupCommonBody'
        - type: object
          required: [gender, stateOfOrigin, stateOfResidence, lgaOfResidence, isStudent]
          properties:
            userType: { type: string, enum: [respondent] }
            gender:
              type: string
              enum: [male, female, non-binary, prefer-not-to-say]
            stateOfOrigin: { type: string }
            stateOfResidence: { type: string }
            lgaOfResidence: { type: string }
            isStudent: { type: boolean, enum: [false] }

    SignupRespondentStudentBody:
      allOf:
        - $ref: '#/components/schemas/SignupCommonBody'
        - type: object
          required:
            [gender, stateOfOrigin, stateOfResidence, lgaOfResidence, isStudent, academicLevel, levelOfStudy, institution, faculty, department]
          properties:
            userType: { type: string, enum: [respondent] }
            gender:
              type: string
              enum: [male, female, non-binary, prefer-not-to-say]
            stateOfOrigin: { type: string }
            stateOfResidence: { type: string }
            lgaOfResidence: { type: string }
            isStudent: { type: boolean, enum: [true] }
            academicLevel: { type: string }
            levelOfStudy: { type: string }
            institution: { type: string }
            faculty: { type: string }
            department: { type: string }

    ResetPasswordBody:
      type: object
      required: [email, code, newPassword, confirmPassword]
      properties:
        email: { type: string, format: email }
        code: { type: string, pattern: '^\d{6}$' }
        newPassword: { type: string, minLength: 8 }
        confirmPassword: { type: string }

    RequestOtpBody:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          pattern: '^\+\d{7,15}$'

    VerifyOtpBody:
      type: object
      required: [phone, code]
      properties:
        phone: { type: string, pattern: '^\+\d{7,15}$' }
        code: { type: string, pattern: '^\d{6}$' }

    RequestEmailOtpBody:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    VerifyEmailOtpBody:
      type: object
      required: [email, code]
      properties:
        email: { type: string, format: email }
        code: { type: string, pattern: '^\d{6}$' }

    RequestAcademicEmailOtpBody:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, pattern: '.*\.edu\.ng$' }

    VerifyAcademicEmailOtpBody:
      type: object
      required: [email, code]
      properties:
        email: { type: string, format: email }
        code: { type: string, pattern: '^\d{6}$' }

    ResearcherProfileBody:
      type: object
      required: [researcherType]
      properties:
        researcherType: { type: string, enum: [student, professional, corporate] }
        # Extra fields conditionally validated

    AccountTypeBody:
      type: object
      required: [userType]
      properties:
        userType:
          type: string
          enum: [researcher, respondent]
          description: Target account type for the existing user.
        # If userType is researcher:
        researcherType:
          type: string
          enum: [student, professional, corporate]
        academicStatus: { type: string }
        institution: { type: string }
        studentEmail: { type: string, format: email }
        faculty: { type: string }
        department: { type: string }
        level: { type: string }
        title: { type: string }
        profession: { type: string }
        areaOfSpecialisation: { type: string }
        employer: { type: string }
        workEmail: { type: string, format: email }
        stateOfPractice: { type: string }
        orgName: { type: string }
        orgType: { type: string }
        industry: { type: string }
        orgEmail: { type: string, format: email }
        orgPhone: { type: string }
        contactName: { type: string }
        contactRole: { type: string }
        stateOfOperation: { type: string }
        billingAddress: { type: string }
        researchPurpose: { type: string }
        expectedMonthlySurveys: { type: string }
        # If userType is respondent:
        gender: { type: string, enum: [male, female, non-binary, prefer-not-to-say] }
        stateOfOrigin: { type: string }
        stateOfResidence: { type: string }
        lgaOfResidence: { type: string }
        isStudent: { type: boolean }
        dateOfBirth: { type: string, format: date-time }

    Layer1Body:
      type: object
      required: [dateOfBirth, gender, stateOfResidence, lgaOfResidence, isStudent]
      properties:
        dateOfBirth: { type: string, format: date-time }
        gender: { type: string }
        stateOfResidence: { type: string }
        lgaOfResidence: { type: string }
        isStudent: { type: boolean }

    Layer2Body:
      type: object
      properties:
        educationLevel: { type: string }
        employmentStatus: { type: string }
        incomeRange: { type: string }
        maritalStatus: { type: string }

    Layer3Body:
      type: object
      description: Health and lifestyle data. All fields are encrypted at rest (AES-256-GCM).
      properties:
        chronicHealthConditions:
          type: array
          items: { type: string }
        disabilityStatus: { type: string }
        smokingStatus: { type: string }
        alcoholConsumption: { type: string }
        exerciseFrequency: { type: string }
        dietaryPattern: { type: string }
        bloodGroup: { type: string }
        genotype: { type: string }
        menstrualHealthStatus:
          type: string
          nullable: true
          description: Female respondents only; enforced at service layer.
        pregnancyStatus:
          type: string
          nullable: true
          description: Female respondents only; enforced at service layer.

    Layer4Body:
      type: object
      description: Socioeconomic data. All fields are encrypted at rest (AES-256-GCM).
      properties:
        monthlyHouseholdIncome: { type: string }
        housingType: { type: string }
        primaryTransport: { type: string }
        internetAccessQuality: { type: string }
        primaryDevice: { type: string }
        numberOfDependants: { type: integer, minimum: 0 }

    Layer5Body:
      type: object
      description: Cultural and identity data. All fields are encrypted at rest (AES-256-GCM).
      properties:
        religion: { type: string }
        ethnicity: { type: string }
        languagesSpoken:
          type: array
          items: { type: string }
        maritalStatus: { type: string }

    ConsentBody:
      type: object
      required: [scopes]
      properties:
        scopes:
          type: array
          items:
            type: string
            enum:
              - basic_profile
              - health_data
              - socioeconomic_data
              - religious_cultural_data
              - survey_participation
              - marketing

    ConsentUpdateBody:
      type: object
      required: [granted]
      properties:
        granted:
          type: boolean
          description: true to grant consent, false to revoke it.
