openapi: 3.0.0
info:
  title: SurveyTools Comprehensive API Collection
  description: >-
    Collection featuring Auth, Admin Gamification, Gamification,
    Marketplace/Vouchers, Redemption, and Visualizations APIs.
  version: 1.0.0
servers:
  - url: http://localhost:5003
tags:
  - name: 1. Authentication
  - name: 2. Admin Controls (Gamification & Marketplace)
  - name: 3. Gamification
  - name: 4. Marketplace & Vouchers
  - name: 5. Graph Visualizations
  - name: 6. Analytics
  - name: 7. Redemption

paths:

  # ─── 1. AUTHENTICATION ───────────────────────────────────────────────────────

  /auth/register:
    post:
      tags:
        - 1. Authentication
      summary: Register New User
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                first_name: John
                last_name: Doe
                email: john.doe@university.edu
                password: StrongPass123!
                confirm_password: StrongPass123!
                department: Computer Science
                faculty: Engineering
                gender: male
                instituition: University of Lagos
      parameters:
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                example:
                  status: success
                  code: 201
                  msg: User successfully created and signed in
                  data:
                    redirectUrl: http://localhost:3000/verification
                    user:
                      id: abc123xyz456
                      fullname: John Doe
                      email: john.doe@university.edu
                      department: Computer Science
                      faculty: Engineering
                      gender: male
                      instituition: University of Lagos
                      verified: false
                      admin: false
                      pointBalance: 0
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '400':
          description: Email already exists or validation error
          content:
            application/json:
              schema:
                type: object
                example:
                  status: failure
                  code: 400
                  msg: Email already exists

  /auth/login:
    post:
      tags:
        - 1. Authentication
      summary: Login (Auto-Saves Token)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                email: user@example.com
                password: yourpassword
      parameters:
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                example:
                  status: success
                  code: 200
                  msg: Login successful
                  data:
                    redirectUrl: http://localhost:3000/dashboard
                    user:
                      id: abc123xyz456
                      fullname: John Doe
                      email: user@example.com
                      verified: true
                      admin: false
                      pointBalance: 350
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                example:
                  status: failure
                  code: 401
                  msg: Invalid credentials

  /verify:
    post:
      tags:
        - 1. Authentication
      summary: Verify Email (OTP)
      description: Submit the OTP code sent to the user's email to verify their account.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                code: 123456
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: User verified successfully
          content:
            application/json:
              schema:
                type: object
                example:
                  status: success
                  code: 200
                  msg: User verified
        '400':
          description: Invalid or expired OTP
          content:
            application/json:
              schema:
                type: object
                example:
                  status: failure
                  code: 400
                  msg: Invalid verification code

  /user/profile:
    get:
      tags:
        - 1. Authentication
      summary: Get User Profile
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
      responses:
        '200':
          description: User profile returned
          content:
            application/json:
              schema:
                type: object
                example:
                  status: success
                  code: 200
                  data:
                    id: abc123xyz456
                    fullname: John Doe
                    email: user@example.com
                    department: Computer Science
                    faculty: Engineering
                    gender: male
                    instituition: University of Lagos
                    verified: true
                    admin: false
                    pointBalance: 350
                    pic_url: null
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                example:
                  status: failure
                  code: 404
                  msg: User not found

  /user/points:
    get:
      tags:
        - 1. Authentication
      summary: Get User Points Balance
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
      responses:
        '200':
          description: Points balance returned
          content:
            application/json:
              schema:
                type: object
                example:
                  status: success
                  code: 200
                  data:
                    pointBalance: 350

  /update-user:
    patch:
      tags:
        - 1. Authentication
      summary: Update User Profile
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                first_name: John
                last_name: Updated
                gender: male
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                example:
                  status: success
                  code: 200
                  msg: User settings successfully updated
                  data:
                    id: abc123xyz456
                    fullname: John Updated
                    email: user@example.com
                    gender: male
                    pointBalance: 350

  /forget-password:
    post:
      tags:
        - 1. Authentication
      summary: Forgot Password (Send Reset Email)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                email: user@example.com
      parameters:
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Reset email sent
          content:
            application/json:
              schema:
                type: object
                example:
                  status: success
                  code: 200
                  msg: Password reset email sent successfully

  /reset-password:
    post:
      tags:
        - 1. Authentication
      summary: Reset Password
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                email: user@example.com
                code: 123456
                newPassword: NewStrongPass123!
                confirmPassword: NewStrongPass123!
      parameters:
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                example:
                  status: success
                  code: 200
                  msg: Password reset successfully

  # ─── 2. ADMIN CONTROLS ───────────────────────────────────────────────────────

  /admin/gamification/missions:
    post:
      tags:
        - 2. Admin Controls (Gamification & Marketplace)
      summary: Create Mission
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                title: Survey Master
                description: Complete 5 surveys today.
                type: daily
                category: surveys
                targetValue: 5
                xpReward: 200
                pointsReward: 50
                isActive: true
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '201':
          description: Mission created successfully
          content:
            application/json:
              schema:
                type: object
                example:
                  status: success
                  data:
                    _id: 64f1a2b3c4d5e6f7a8b9c0d1
                    title: Survey Master
                    description: Complete 5 surveys today.
                    type: daily
                    category: surveys
                    targetValue: 5
                    xpReward: 200
                    pointsReward: 50
                    isActive: true
                    createdAt: '2026-11-06T00:00:00.000Z'
        '400':
          description: Validation error (e.g. missing required field)
          content:
            application/json:
              schema:
                type: object
                example:
                  status: failure
                  code: 400
                  msg: Path `category` is required.
    get:
      tags:
        - 2. Admin Controls (Gamification & Marketplace)
      summary: Get All Missions (Admin)
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
      responses:
        '200':
          description: List of all missions
          content:
            application/json:
              schema:
                type: object
                example:
                  status: success
                  data:
                    - _id: 64f1a2b3c4d5e6f7a8b9c0d1
                      title: Survey Master
                      description: Complete 5 surveys today.
                      type: daily
                      category: surveys
                      targetValue: 5
                      xpReward: 200
                      pointsReward: 50
                      isActive: true
                    - _id: 64f1a2b3c4d5e6f7a8b9c0d2
                      title: Weekly Streak
                      description: Complete 3 surveys this week.
                      type: weekly
                      category: streak
                      targetValue: 3
                      xpReward: 500
                      pointsReward: 100
                      isActive: true

  /admin/marketplace/listings:
    post:
      tags:
        - 2. Admin Controls (Gamification & Marketplace)
      summary: Create Marketplace Listing
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                title: 10% Amazon Gift Card
                description: Get 10% off your next Amazon purchase.
                type: gift_card
                pointsCost: 500
                value: 10% Off
                partnerName: Amazon
                stock: 100
                isActive: true
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '201':
          description: Listing created successfully
          content:
            application/json:
              schema:
                type: object
                example:
                  status: success
                  data:
                    _id: 64f2b3c4d5e6f7a8b9c0d2e3
                    title: 10% Amazon Gift Card
                    description: Get 10% off your next Amazon purchase.
                    type: gift_card
                    pointsCost: 500
                    value: 10% Off
                    partnerName: Amazon
                    stock: 100
                    isActive: true
                    createdAt: '2026-11-06T00:00:00.000Z'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                example:
                  status: failure
                  code: 400
                  msg: "Path `title` is required. `airtime` is not a valid enum value for path `type`."
    get:
      tags:
        - 2. Admin Controls (Gamification & Marketplace)
      summary: Get All Marketplace Listings (Admin)
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
      responses:
        '200':
          description: List of all marketplace listings
          content:
            application/json:
              schema:
                type: object
                example:
                  status: success
                  data:
                    - _id: 64f2b3c4d5e6f7a8b9c0d2e3
                      title: 10% Amazon Gift Card
                      description: Get 10% off your next Amazon purchase.
                      type: gift_card
                      pointsCost: 500
                      value: 10% Off
                      partnerName: Amazon
                      stock: 100
                      isActive: true
                    - _id: 64f2b3c4d5e6f7a8b9c0d2e4
                      title: Premium Upgrade - 1 Month
                      description: Unlock premium features for 30 days.
                      type: premium_upgrade
                      pointsCost: 1000
                      value: 30 days premium
                      partnerName: SurveyTools
                      stock: 999
                      isActive: true

  /admin/gamification/levels:
    post:
      tags:
        - 2. Admin Controls (Gamification & Marketplace)
      summary: Create Level Config
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                level: 2
                name: Explorer
                minXP: 1000
                maxXP: 2500
                pointsMultiplier: 1.2
                benefits:
                  - Extra spin wheel attempt
                surveyAccess: basic
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '201':
          description: Level config created
          content:
            application/json:
              schema:
                type: object
                example:
                  status: success
                  data:
                    _id: 64f3c4d5e6f7a8b9c0d2e3f4
                    level: 2
                    name: Explorer
                    minXP: 1000
                    maxXP: 2500
                    pointsMultiplier: 1.2
                    benefits:
                      - Extra spin wheel attempt
                    surveyAccess: basic
    get:
      tags:
        - 2. Admin Controls (Gamification & Marketplace)
      summary: Get All Level Configs (Admin)
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
      responses:
        '200':
          description: List of all level configs
          content:
            application/json:
              schema:
                type: object
                example:
                  status: success
                  data:
                    - _id: 64f3c4d5e6f7a8b9c0d2e3f1
                      level: 1
                      name: Novice
                      minXP: 0
                      maxXP: 499
                      benefits:
                        - Basic surveys
                      surveyAccess: basic
                    - _id: 64f3c4d5e6f7a8b9c0d2e3f2
                      level: 2
                      name: Explorer
                      minXP: 500
                      maxXP: 1999
                      benefits:
                        - Basic surveys
                        - Daily spin
                      surveyAccess: basic
                    - _id: 64f3c4d5e6f7a8b9c0d2e3f3
                      level: 3
                      name: Master
                      minXP: 2000
                      maxXP: 9999
                      benefits:
                        - Premium surveys
                        - Daily spin
                      surveyAccess: premium

  /admin/gamification/vip:
    post:
      tags:
        - 2. Admin Controls (Gamification & Marketplace)
      summary: Create VIP Tier Config
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                tier: silver
                minPoints: 1000
                maxPoints: 4999
                conversionRate: 1.2
                bonusOnRewards: 5
                supportLevel: priority
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '201':
          description: VIP tier config created
          content:
            application/json:
              schema:
                type: object
                example:
                  status: success
                  data:
                    _id: 64f4d5e6f7a8b9c0d2e3f4a5
                    tier: silver
                    minPoints: 1000
                    maxPoints: 4999
                    conversionRate: 1.2
                    bonusOnRewards: 5
                    supportLevel: priority
    get:
      tags:
        - 2. Admin Controls (Gamification & Marketplace)
      summary: Get All VIP Tier Configs (Admin)
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
      responses:
        '200':
          description: List of all VIP tier configs
          content:
            application/json:
              schema:
                type: object
                example:
                  status: success
                  data:
                    - tier: bronze
                      minPoints: 0
                      maxPoints: 999
                      conversionRate: 1
                      bonusOnRewards: 0
                      supportLevel: standard
                    - tier: silver
                      minPoints: 1000
                      maxPoints: 4999
                      conversionRate: 1.2
                      bonusOnRewards: 10
                      supportLevel: standard
                    - tier: gold
                      minPoints: 5000
                      maxPoints: 19999
                      conversionRate: 1.5
                      bonusOnRewards: 25
                      supportLevel: priority
                    - tier: platinum
                      minPoints: 20000
                      maxPoints: 999999
                      conversionRate: 2
                      bonusOnRewards: 50
                      supportLevel: dedicated

  /admin/gamification/achievements:
    post:
      tags:
        - 2. Admin Controls (Gamification & Marketplace)
      summary: Create Achievement
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                title: Survey Veteran
                description: Complete 10 surveys to unlock this badge.
                category: surveys
                triggerValue: 10
                xpReward: 500
                pointsReward: 100
                isActive: true
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '201':
          description: Achievement created
          content:
            application/json:
              schema:
                type: object
                example:
                  status: success
                  data:
                    _id: 64f5e6f7a8b9c0d2e3f4a5b6
                    title: Survey Veteran
                    description: Complete 10 surveys to unlock this badge.
                    category: surveys
                    triggerValue: 10
                    xpReward: 500
                    pointsReward: 100
                    isActive: true

  /admin/gamification/bonus-events:
    post:
      tags:
        - 2. Admin Controls (Gamification & Marketplace)
      summary: Create Bonus Event
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                title: Weekend 2x Points Boost
                description: Earn double points on all surveys this weekend.
                multiplier: 2
                targetType: all_users
                startAt: '2026-11-08T00:00:00.000Z'
                endAt: '2026-11-10T23:59:59.000Z'
                isActive: true
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '201':
          description: Bonus event created
          content:
            application/json:
              schema:
                type: object
                example:
                  status: success
                  data:
                    _id: 64f6f7a8b9c0d2e3f4a5b6c7
                    title: Weekend 2x Points Boost
                    description: Earn double points on all surveys this weekend.
                    multiplier: 2
                    targetType: all_users
                    startAt: '2026-11-08T00:00:00.000Z'
                    endAt: '2026-11-10T23:59:59.000Z'
                    isActive: true
    get:
      tags:
        - 2. Admin Controls (Gamification & Marketplace)
      summary: Get All Bonus Events (Admin)
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
      responses:
        '200':
          description: List of all bonus events
          content:
            application/json:
              schema:
                type: object
                example:
                  status: success
                  data:
                    - _id: 64f6f7a8b9c0d2e3f4a5b6c7
                      title: Weekend 2x Points Boost
                      description: Earn double points on all surveys this weekend.
                      multiplier: 2
                      targetType: all_users
                      startAt: '2026-11-08T00:00:00.000Z'
                      endAt: '2026-11-10T23:59:59.000Z'
                      isActive: true

  /admin/users:
    get:
      tags:
        - 2. Admin Controls (Gamification & Marketplace)
      summary: Get All Users (Admin)
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
        - name: page
          in: query
          schema:
            type: integer
          example: 1
        - name: limit
          in: query
          schema:
            type: integer
          example: 20
        - name: search
          in: query
          schema:
            type: string
          example: john
        - name: sortBy
          in: query
          schema:
            type: string
          example: createdAt
        - name: sortOrder
          in: query
          schema:
            type: string
          example: desc
      responses:
        '200':
          description: Paginated list of users
          content:
            application/json:
              schema:
                type: object
                example:
                  status: success
                  code: 200
                  data:
                    users:
                      - id: abc123xyz456
                        fullname: John Doe
                        email: john.doe@university.edu
                        department: Computer Science
                        faculty: Engineering
                        gender: male
                        verified: true
                        admin: false
                        pointBalance: 350
                      - id: def456uvw789
                        fullname: Jane Smith
                        email: jane.smith@university.edu
                        department: Economics
                        faculty: Social Sciences
                        gender: female
                        verified: true
                        admin: false
                        pointBalance: 120
                    pagination:
                      currentPage: 1
                      totalPages: 6
                      totalUsers: 114
                      limit: 20
                      hasNext: true
                      hasPrev: false

  /admin/users/{userId}/admin:
    patch:
      tags:
        - 2. Admin Controls (Gamification & Marketplace)
      summary: Make User Admin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                adminStatus: true
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
        - name: userId
          in: path
          schema:
            type: string
          required: true
          example: '{{userId}}'
      responses:
        '200':
          description: Admin status updated
          content:
            application/json:
              schema:
                type: object
                example:
                  status: success
                  code: 200
                  msg: User granted admin privileges successfully
                  data:
                    userId: abc123xyz456
                    fullname: John Doe
                    email: john.doe@university.edu
                    admin: true

  /admin/surveys:
    get:
      tags:
        - 2. Admin Controls (Gamification & Marketplace)
      summary: Get All Surveys (Admin)
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
        - name: page
          in: query
          schema:
            type: integer
          example: 1
        - name: limit
          in: query
          schema:
            type: integer
          example: 20
        - name: published
          in: query
          schema:
            type: string
          example: 'true'
        - name: paid
          in: query
          schema:
            type: string
          example: 'false'
      responses:
        '200':
          description: Paginated list of surveys with payment info
          content:
            application/json:
              schema:
                type: object
                example:
                  status: success
                  code: 200
                  data:
                    surveys:
                      - _id: 64a1b2c3d4e5f6a7b8c9d0e1
                        title: Student Life Survey 2026
                        description: Tell us about your campus experience
                        published: true
                        isPaid: true
                        no_of_participants: 50
                        filledCount: 23
                        remainingSpots: 27
                        payment:
                          amount: 15000
                          datePaid: '2026-11-01T10:30:00.000Z'
                          referenceNumber: ADMIN_1730123456_abc123
                        user_id:
                          id: abc123xyz456
                          fullname: John Doe
                          email: john.doe@university.edu
                    pagination:
                      currentPage: 1
                      totalPages: 3
                      totalSurveys: 45
                      limit: 20
                      hasNext: true
                      hasPrev: false

  /admin/surveys/{surveyId}/mark-paid:
    post:
      tags:
        - 2. Admin Controls (Gamification & Marketplace)
      summary: Mark Survey as Paid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                email: surveyor@example.com
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
        - name: surveyId
          in: path
          schema:
            type: string
          required: true
          example: '{{surveyId}}'
      responses:
        '200':
          description: Survey marked as paid
          content:
            application/json:
              schema:
                type: object
                example:
                  status: success
