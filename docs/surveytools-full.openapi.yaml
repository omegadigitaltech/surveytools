openapi: 3.0.0
info:
  title: SurveyTools Comprehensive API Collection
  description: 'Complete API Collection for SurveyTools covering Authentication, Admin Controls, Gamification, Marketplace, Visualizations, Analytics, OTP Verification, Progressive Profiles, NDPR Compliance, Corporate Dashboard, Core Surveys, and Telecom Redemption.'
  version: 1.0.0
servers:
  - url: 'http://localhost:5003'
    description: Local server
tags:
  - name: 1. Authentication
    description: 'User registration, login, token refresh, and session management'
  - name: 2. Admin Controls (Gamification & Marketplace)
    description: 'Admin operations for missions, levels, VIP tiers, marketplace items, users, and surveys'
  - name: 3. Gamification
    description: 'User rewards, daily spin wheel, active missions, leaderboards, and achievements'
  - name: 4. Marketplace & Vouchers
    description: 'Marketplace listings, points-to-voucher conversions, and voucher wallet'
  - name: 5. Graph Visualizations
    description: Survey visual chart data
  - name: 6. Analytics
    description: 'Survey response analytics, trends, engagement, and AI insights'
  - name: 7. OTP Verification
    description: 'Phone OTP, General Email OTP, and Academic Email OTP request and verification'
  - name: 8. Profiles & Progressive Layers
    description: 'Researcher profiles, tier evaluation, account type switching, and progressive respondent layers 1-5'
  - name: 9. NDPR & Compliance
    description: 'NDPR user consent capture, marketing consent revocation, and right-to-erasure account deletion'
  - name: 10. User Profile & Legacy Auth
    description: Legacy profile inspection and legacy verification endpoints
  - name: 11. Corporate Dashboard
    description: 'Institutional researcher corporate analytics, survey data export, and invoices'
  - name: 12. Core Surveys
    description: 'Survey creation, bulk question management, and survey details'
  - name: 13. Redemption
    description: Direct telecom airtime and mobile data plan redemption with verified phone
paths:
  /v1/kyc/register:
    post:
      tags:
        - 1. Authentication
      summary: Unified Registration (Respondent & Researcher)
      description: Unified registration endpoint supporting both respondent and researcher accounts with userType discrimination.
      parameters:
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - email
                - password
                - userType
                - dateOfBirth
              properties:
                firstName:
                  type: string
                  example: John
                lastName:
                  type: string
                  example: Doe
                email:
                  type: string
                  format: email
                  example: john.doe@example.com
                password:
                  type: string
                  minLength: 8
                  example: SecurePass123!
                userType:
                  type: string
                  enum:
                    - respondent
                    - researcher
                  example: respondent
                dateOfBirth:
                  type: string
                  format: date-time
                  example: '1995-06-15T00:00:00.000Z'
                gender:
                  type: string
                  enum:
                    - male
                    - female
                    - non-binary
                    - prefer-not-to-say
                  example: male
                stateOfOrigin:
                  type: string
                  example: Lagos
                stateOfResidence:
                  type: string
                  example: Lagos
                lgaOfResidence:
                  type: string
                  example: Ikeja
                isStudent:
                  type: boolean
                  example: false
            example:
              firstName: John
              lastName: Doe
              email: john.doe@example.com
              password: SecurePass123!
              userType: respondent
              dateOfBirth: '1995-06-15T00:00:00.000Z'
              gender: male
              stateOfResidence: Lagos
              lgaOfResidence: Ikeja
              isStudent: false
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                code: 201
                message: User created successfully
                data:
                  userId: usr_98a7b6c5d4e3f2a1
        '400':
          description: Error response
          content:
            application/json:
              schema:
                type: object
              example:
                status: failure
                code: 400
                msg: Email already registered or age must be 18+
  /auth/register:
    post:
      tags:
        - 1. Authentication
      summary: Register New User (Legacy University Flow)
      description: 'Academic flow registration supporting userType, university faculty, department, and institutions.'
      parameters:
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - first_name
                - last_name
                - email
                - password
                - confirm_password
                - department
                - faculty
                - gender
                - instituition
              properties:
                first_name:
                  type: string
                  example: John
                last_name:
                  type: string
                  example: Doe
                email:
                  type: string
                  format: email
                  example: john.doe@university.edu
                password:
                  type: string
                  example: StrongPass123!
                confirm_password:
                  type: string
                  example: StrongPass123!
                userType:
                  type: string
                  enum:
                    - respondent
                    - researcher
                  example: respondent
                department:
                  type: string
                  example: Computer Science
                faculty:
                  type: string
                  example: Engineering
                gender:
                  type: string
                  enum:
                    - male
                    - female
                  example: male
                instituition:
                  type: string
                  example: University of Lagos
            example:
              first_name: John
              last_name: Doe
              email: john.doe@university.edu
              password: StrongPass123!
              confirm_password: StrongPass123!
              userType: respondent
              department: Computer Science
              faculty: Engineering
              gender: male
              instituition: University of Lagos
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                code: 201
                msg: User successfully created and signed in
                data:
                  redirectUrl: 'http://localhost:3000/verification'
                  user:
                    id: abc123xyz456
                    fullname: John Doe
                    email: john.doe@university.edu
                    userType: respondent
                    department: Computer Science
                    faculty: Engineering
                    gender: male
                    instituition: University of Lagos
                    verified: false
                    admin: false
                    pointBalance: 0
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '400':
          description: Error response
          content:
            application/json:
              schema:
                type: object
              example:
                status: failure
                code: 400
                msg: Email already exists or required fields missing
  /auth/login:
    post:
      tags:
        - 1. Authentication
      summary: Login (Auto-Saves Token)
      parameters:
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              email: foluwaseyipeter450@gmail.com
              password: password
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                code: 200
                msg: Login successful
                data:
                  redirectUrl: 'http://localhost:3000/dashboard'
                  user:
                    id: abc123xyz456
                    fullname: Peter Parker
                    email: foluwaseyipeter450@gmail.com
                    verified: true
                    admin: true
                    pointBalance: 1250
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '401':
          description: Error response
          content:
            application/json:
              schema:
                type: object
              example:
                status: failure
                code: 401
                msg: Invalid credentials
  /forget-password:
    post:
      tags:
        - 1. Authentication
      summary: Forgot Password (Request Reset OTP)
      parameters:
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              email: foluwaseyipeter450@gmail.com
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                code: 200
                msg: Password reset email sent successfully
  /reset-password:
    post:
      tags:
        - 1. Authentication
      summary: Reset Password (Submit OTP)
      parameters:
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              email: foluwaseyipeter450@gmail.com
              code: '123456'
              newPassword: NewSecurePass456!
              confirmPassword: NewSecurePass456!
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                code: 200
                msg: Password reset successfully
        '400':
          description: Error response
          content:
            application/json:
              schema:
                type: object
              example:
                status: failure
                code: 400
                msg: Invalid or expired OTP
  /isLoggedIn:
    get:
      tags:
        - 1. Authentication
      summary: Check Login Status
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          example: 'Bearer {{token}}'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                code: 200
                msg: User is Logged in
                data:
                  isLoggedIn: true
  /update-user:
    patch:
      tags:
        - 1. Authentication
      summary: Update User Profile
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          example: 'Bearer {{token}}'
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              fullname: Peter Parker Updated
              gender: male
              age: 26
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                code: 200
                msg: User settings successfully updated
                data:
                  id: abc123xyz456
                  fullname: Peter Parker Updated
                  email: foluwaseyipeter450@gmail.com
                  gender: male
  /user/profile:
    get:
      tags:
        - 1. Authentication
      summary: Get User Profile
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          example: 'Bearer {{token}}'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                code: 200
                data:
                  id: abc123xyz456
                  fullname: Peter Parker
                  email: foluwaseyipeter450@gmail.com
                  userType: researcher
                  admin: true
                  pointBalance: 1250
  /user/points:
    get:
      tags:
        - 1. Authentication
      summary: Get User Points Balance
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          example: 'Bearer {{token}}'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                code: 200
                data:
                  pointBalance: 1250
  /auth/logout:
    get:
      tags:
        - 1. Authentication
      summary: Logout User
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          example: 'Bearer {{token}}'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                code: 200
                msg: Successfully logged out
  /admin/gamification/missions:
    post:
      tags:
        - 2. Admin Controls (Gamification & Marketplace)
      summary: Create Mission
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          example: 'Bearer {{token}}'
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              title: Complete 3 Surveys
              description: Finish 3 surveys this week
              type: weekly
              category: surveys
              targetValue: 3
              xpReward: 150
              pointsReward: 50
              isActive: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                data:
                  _id: 64f1a2b3c4d5e6f7a8b9c0d1
                  title: Complete 3 Surveys
                  type: weekly
                  category: surveys
                  targetValue: 3
                  xpReward: 150
                  pointsReward: 50
                  isActive: true
        '400':
          description: Error response
          content:
            application/json:
              schema:
                type: object
              example:
                status: failure
                code: 400
                msg: Path `category` is required.
    get:
      tags:
        - 2. Admin Controls (Gamification & Marketplace)
      summary: Get All Missions (Admin)
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          example: 'Bearer {{token}}'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                data:
                  - _id: 64f1a2b3c4d5e6f7a8b9c0d1
                    title: Complete 3 Surveys
                    type: weekly
                    category: surveys
                    targetValue: 3
                    xpReward: 150
                    pointsReward: 50
                    isActive: true
  /admin/marketplace/listings:
    post:
      tags:
        - 2. Admin Controls (Gamification & Marketplace)
      summary: Create Marketplace Listing
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          example: 'Bearer {{token}}'
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              title: 10% Amazon Gift Card
              description: Get 10% off your next Amazon purchase.
              type: gift_card
              pointsCost: 500
              value: 10% Off
              partnerName: Amazon
              stock: 100
              isActive: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                data:
                  _id: 64f2b3c4d5e6f7a8b9c0d2e3
                  title: 10% Amazon Gift Card
                  type: gift_card
                  pointsCost: 500
                  stock: 100
                  isActive: true
        '400':
          description: Error response
          content:
            application/json:
              schema:
                type: object
              example:
                status: failure
                code: 400
                msg: Path `title` is required.
    get:
      tags:
        - 2. Admin Controls (Gamification & Marketplace)
      summary: Get All Marketplace Listings (Admin)
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          example: 'Bearer {{token}}'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                data:
                  - _id: 64f2b3c4d5e6f7a8b9c0d2e3
                    title: 10% Amazon Gift Card
                    type: gift_card
                    pointsCost: 500
                    stock: 100
                    isActive: true
  /admin/gamification/levels:
    post:
      tags:
        - 2. Admin Controls (Gamification & Marketplace)
      summary: Create Level Config
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          example: 'Bearer {{token}}'
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              level: 2
              name: Explorer
              minXP: 1000
              maxXP: 2500
              pointsMultiplier: 1.2
              benefits:
                - Extra daily spin
              surveyAccess: basic
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                data:
                  _id: 64f3c4d5e6f7a8b9c0d2e3f4
                  level: 2
                  name: Explorer
                  minXP: 1000
                  maxXP: 2500
                  pointsMultiplier: 1.2
                  benefits:
                    - Extra daily spin
    get:
      tags:
        - 2. Admin Controls (Gamification & Marketplace)
      summary: Get All Level Configs (Admin)
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          example: 'Bearer {{token}}'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                data:
                  - level: 1
                    name: Novice
                    minXP: 0
                    maxXP: 499
                  - level: 2
                    name: Explorer
                    minXP: 500
                    maxXP: 1999
  /admin/gamification/vip:
    post:
      tags:
        - 2. Admin Controls (Gamification & Marketplace)
      summary: Create VIP Tier Config
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          example: 'Bearer {{token}}'
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              tier: silver
              minPoints: 1000
              maxPoints: 4999
              conversionRate: 1.2
              bonusOnRewards: 10
              supportLevel: priority
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                data:
                  tier: silver
                  minPoints: 1000
                  maxPoints: 4999
                  conversionRate: 1.2
    get:
      tags:
        - 2. Admin Controls (Gamification & Marketplace)
      summary: Get All VIP Tier Configs (Admin)
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          example: 'Bearer {{token}}'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                data:
                  - tier: bronze
                    minPoints: 0
                    maxPoints: 999
                  - tier: silver
                    minPoints: 1000
                    maxPoints: 4999
  /admin/gamification/achievements:
    post:
      tags:
        - 2. Admin Controls (Gamification & Marketplace)
      summary: Create Achievement
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          example: 'Bearer {{token}}'
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              title: Survey Starter
              description: Complete your first survey
              category: surveys
              triggerValue: 1
              xpReward: 100
              pointsReward: 50
              isActive: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                data:
                  _id: 64f5e6f7a8b9c0d2e3f4a5b6
                  title: Survey Starter
                  triggerValue: 1
  /admin/gamification/bonus-events:
    post:
      tags:
        - 2. Admin Controls (Gamification & Marketplace)
      summary: Create Bonus Event
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          example: 'Bearer {{token}}'
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              title: Weekend XP Boost
              description: Earn 2x XP on all surveys this weekend
              multiplier: 2
              targetType: all_users
              startAt: '2026-11-08T00:00:00.000Z'
              endAt: '2026-11-10T23:59:59.000Z'
              isActive: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                data:
                  _id: 64f6f7a8b9c0d2e3f4a5b6c7
                  title: Weekend XP Boost
                  multiplier: 2
    get:
      tags:
        - 2. Admin Controls (Gamification & Marketplace)
      summary: Get All Bonus Events (Admin)
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          example: 'Bearer {{token}}'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                data:
                  - _id: 64f6f7a8b9c0d2e3f4a5b6c7
                    title: Weekend XP Boost
                    multiplier: 2
  /admin/users:
    get:
      tags:
        - 2. Admin Controls (Gamification & Marketplace)
      summary: Get All Users (Admin)
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          example: 'Bearer {{token}}'
        - name: page
          in: query
          schema:
            type: integer
          example: 1
        - name: limit
          in: query
          schema:
            type: integer
          example: 20
        - name: search
          in: query
          schema:
            type: string
          example: peter
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                code: 200
                data:
                  users:
                    - id: abc123xyz456
                      fullname: Peter Parker
                      email: foluwaseyipeter450@gmail.com
                      admin: true
                      pointBalance: 1250
                  pagination:
                    currentPage: 1
                    totalPages: 1
                    totalUsers: 1
                    limit: 20
  '/admin/users/{userId}/admin':
    patch:
      tags:
        - 2. Admin Controls (Gamification & Marketplace)
      summary: Make User Admin
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          example: 'Bearer {{token}}'
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
        - name: userId
          in: path
          required: true
          schema:
            type: string
          example: '{{userId}}'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              adminStatus: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                code: 200
                msg: User granted admin privileges successfully
  /admin/surveys:
    get:
      tags:
        - 2. Admin Controls (Gamification & Marketplace)
      summary: Get All Surveys (Admin)
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          example: 'Bearer {{token}}'
        - name: page
          in: query
          schema:
            type: integer
          example: 1
        - name: limit
          in: query
          schema:
            type: integer
          example: 20
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                code: 200
                data:
                  surveys:
                    - _id: 64a1b2c3d4e5f6a7b8c9d0e1
                      title: Student Life Survey 2026
                      published: true
                      isPaid: true
  '/admin/surveys/{surveyId}/mark-paid':
    post:
      tags:
        - 2. Admin Controls (Gamification & Marketplace)
      summary: Mark Survey as Paid
